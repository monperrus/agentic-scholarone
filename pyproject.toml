[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentic-scholarone"
version = "0.1.0"
description = "Drive ScholarOne / ManuscriptCentral as a journal editor: a Python library for agents and an interactive REPL for humans"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Martin Monperrus" }]
keywords = ["scholarone", "manuscriptcentral", "peer review", "editor", "agent"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Science/Research",
]
dependencies = ["curl_cffi>=0.7", "beautifulsoup4>=4.12", "tqdm>=4.66"]

[project.optional-dependencies]
keyring = ["keyring>=24"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.10"]

[project.urls]
Homepage = "https://github.com/monperrus/agentic-scholarone"

[project.scripts]
agentic-scholarone = "agentic_scholarone._session:main"

[tool.hatch.build.targets.wheel]
packages = ["agentic_scholarone"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "UP"]

[tool.mypy]
ignore_missing_imports = true
# BeautifulSoup types attribute values as `str | AttributeValueList | None`;
# the page parsers read them as str. Codes that catch real defects
# (name-defined, attr-defined, func-returns-value, call-arg) stay on.
disable_error_code = ["union-attr", "arg-type", "assignment", "index", "operator", "return-value", "call-overload"]
